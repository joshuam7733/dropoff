# Supabase CLI configuration for Drop Off (used by `supabase start` locally and as a reference for the
# hosted project's settings). Secrets are never written here: they come from env() / `supabase secrets set`.
project_id = "dropoff"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
# Demo data is for local development only. Never run supabase/seed.sql against production.
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "env(APP_URL)"
additional_redirect_urls = ["env(APP_URL)/app.html", "env(APP_URL)/app-vendor.html", "env(APP_URL)/app-rider.html", "env(APP_URL)/track.html"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.rate_limit]
email_sent = 4
sms_sent = 30
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
otp_expiry = 3600

# Phone sign-in with a 6-digit code. Codes are delivered by the send-sms-hook Edge Function (Africa's Talking).
[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Your Drop Off code is {{ .Code }}"
max_frequency = "30s"

[auth.hook.send_sms]
enabled = true
uri = "env(SEND_SMS_HOOK_URI)"
secrets = "env(SEND_SMS_HOOK_SECRET)"

# "Continue with Google". Create an OAuth client in Google Cloud Console (Web application) with the
# authorised redirect URI https://<project-ref>.supabase.co/auth/v1/callback
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

[edge_runtime]
enabled = true
policy = "per_worker"

# Functions called by the apps carry the user's JWT. Provider callbacks, the SMS hook and cron jobs do not:
# they authenticate with signatures or a shared secret instead (checked inside each function).
[functions.payments-initiate]
verify_jwt = true

[functions.payments-webhook]
verify_jwt = false

[functions.payments-reconcile]
verify_jwt = false

[functions.payments-sandbox]
verify_jwt = false

[functions.recipient-proof]
verify_jwt = false

[functions.send-sms-hook]
verify_jwt = false

[functions.sms-dispatch]
verify_jwt = false
